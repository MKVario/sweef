name: App bauen

on:
  push:
    branches-ignore: [main]
    paths:
      - 'android-app/**'
      - 'index.html'
      - '.github/workflows/android.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: App-Nummer (zaehlt nur Aenderungen an der App)
        run: |
          N=$(git rev-list --count HEAD -- index.html android-app manifest.webmanifest icon-192.png icon-512.png)
          echo "APP_NR=$N" >> $GITHUB_ENV
          echo "::notice::App-Nummer $N"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Web-Oberflaeche in die App kopieren
        run: |
          W=android-app/app/src/main/assets/www
          mkdir -p $W
          cp index.html manifest.webmanifest icon-192.png icon-512.png $W/
          cp android-app/web/sweef-bridge.js $W/
          sed -i 's#</body>#<script src="sweef-bridge.js"></script>\n</body>#' $W/index.html
          grep -c "sweef-bridge.js" $W/index.html

      - name: Schluessel pruefen
        env:
          SWEEF_KEYSTORE_PW: ${{ secrets.SWEEF_KEYSTORE_PW }}
        run: |
          if [ -z "$SWEEF_KEYSTORE_PW" ]; then
            echo "::warning::Geheimnis SWEEF_KEYSTORE_PW fehlt - baue nur eine Test-Version"
            echo "ZIEL=assembleDebug" >> $GITHUB_ENV
            echo "APK=app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_ENV
          else
            echo "ZIEL=assembleRelease" >> $GITHUB_ENV
            echo "APK=app/build/outputs/apk/release/app-release.apk" >> $GITHUB_ENV
          fi

      - name: APK bauen
        shell: bash
        env:
          SWEEF_KEYSTORE_PW: ${{ secrets.SWEEF_KEYSTORE_PW }}
        working-directory: android-app
        run: |
          set +e
          gradle --no-daemon $ZIEL 2>&1 | tee bau.log
          status=${PIPESTATUS[0]}
          set -e
          melde() { z="${2//%/%25}"; z="${z//$'\r'/}"; z="$(echo "$z" | cut -c1-300)"; [ -n "$z" ] && echo "::$1::$z"; return 0; }
          if [ $status -ne 0 ]; then
            grep -E "^e: |error:|What went wrong|Could not|^> |Execution failed" bau.log | grep -v "^> Task" | head -25 | while IFS= read -r z; do melde error "$z"; done
          fi
          exit $status

      - name: APK umbenennen
        run: |
          NAME=sweef_app_v1_0_${APP_NR}.apk
          cp android-app/$APK $NAME
          echo "::notice::$NAME ($(du -h $NAME | cut -f1)) gebaut"

      - uses: actions/upload-artifact@v4
        with:
          name: sweef-app
          path: sweef_app_v1_0_*.apk
