name: Firmware bauen

on:
  push:
    branches-ignore: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        display: [gross, klein]
    steps:
      - uses: actions/checkout@v4

      - name: arduino-cli installieren
        uses: arduino/setup-arduino-cli@v2

      - name: Board-Paket und Bibliotheken
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json
          arduino-cli core update-index
          arduino-cli core install Seeeduino:nrf52
          arduino-cli board listall | grep -i xiao || true
          arduino-cli lib install "Adafruit DPS310" "U8g2" "Seeed Arduino LSM6DS3" "Adafruit SPIFlash"
          pip install adafruit-nrfutil

      - name: Kompilieren
        shell: bash
        run: |
          if [ "${{ matrix.display }}" = "klein" ]; then FLAG="-DDISPLAY_KLEIN=1"; else FLAG="-DDISPLAY_KLEIN=0"; fi
          set +e
          arduino-cli compile --fqbn Seeeduino:nrf52:xiaonRF52840Sense \
            --build-property "compiler.cpp.extra_flags=$FLAG" \
            --output-dir build firmware/sweef_vario 2>&1 | tee compile.log
          status=${PIPESTATUS[0]}
          set -e
          # Fehler als Hinweise sichtbar machen
          melde() { z="${2//%/%25}"; z="${z//$'\r'/}"; z="$(echo "$z" | sed 's/^[[:space:]]*//' | cut -c1-300)"; [ -n "$z" ] && echo "::$1::$z"; return 0; }
          if [ $status -ne 0 ]; then
            grep -iE "undefined|error" compile.log | head -8 | while IFS= read -r z; do melde error "$z"; done
            tail -6 compile.log | while IFS= read -r z; do melde warning "$z"; done
          fi
          grep -E "Sketch uses|Global variables" compile.log | while IFS= read -r z; do echo "::notice::${{ matrix.display }}: $z"; done
          ls build | while IFS= read -r z; do echo "::notice::Datei: $z"; done
          exit $status

      - name: Update-Datei (DFU) erzeugen
        run: |
          HEX=$(ls build/*.hex | head -1)
          if ls build/*.zip >/dev/null 2>&1; then
            cp "$(ls build/*.zip | head -1)" sweef_firmware_${{ matrix.display }}.zip
            echo "::notice::DFU-Paket vom Board-Paket uebernommen"
          else
            adafruit-nrfutil dfu genpkg --dev-type 0x0052 --application "$HEX" sweef_firmware_${{ matrix.display }}.zip
            echo "::notice::DFU-Paket mit adafruit-nrfutil erzeugt"
          fi
          cp "$HEX" sweef_firmware_${{ matrix.display }}.hex
          ls -la *.zip

      - name: Versionsdatei
        run: |
          grep -oP '#define FW_VERSION "\K[^"]+' firmware/sweef_vario/sweef_vario.ino > version.txt
          echo "::notice::Firmware-Version $(cat version.txt)"

      - uses: actions/upload-artifact@v4
        with:
          name: sweef_firmware_${{ matrix.display }}
          overwrite: true
          path: |
            sweef_firmware_${{ matrix.display }}.zip
            sweef_firmware_${{ matrix.display }}.hex
            version.txt
